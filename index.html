<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="style.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="manage">

        <header>
            <h1 id="head">Products Management</h1>
            <p id="details">Your Work Will Be Easier</p>
            
            <button  id="dark">
                <i class="bi bi-sun"></i>
            </button>
        </header>

        <div class="inputs">
            <input id="title" placeholder="Title">
            
            <div class="money">
           <input  onkeyup="getTotal()" type="number" id="price" placeholder="Price"  min="0">
            <input onkeyup="getTotal()" type="number" id="taxes" placeholder="Taxes" min="0">
            <input onkeyup="getTotal()" type="number" id="ads"   placeholder="Ads"   min="0" >
            <input onkeyup="getTotal()"  type="number" id="discount" placeholder="Discount"  min="0">
            <small  id="total" ></small>
            </div>
  
            <input type="number" id="quantity" placeholder="Quantity" min="0">
            <input id="category" placeholder="Category">
            <button id="create" class="btnstyle">Create</button>

        </div>



        <div class="outputs">

            <div class="searchSection">
          <input onkeyup="searchproducts(this.value)" placeholder="Search" id="search">

            <div class="searchbtn">
                <button onclick="search_mode('bytitle')" id="bytitle" class="btnstyle">Search By Title</button>
                <button onclick="search_mode('bycategory')" id="bycategory" class="btnstyle">Search By Category</button>
            </div>
            </div>

               <div id="deleteall">
               </div>

            <div class="data">
                <table>
                    <thead>
                        <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Taxes</th>
                    <th>Ads</th>
                    <th>Discount</th>
                    <th>Total</th>
                    <th>Category</th>
                    <th id="green">Update</th>
                    <th id="red">Delete</th>
                    </tr>
                    </thead>
                    
                    <tbody id="tbody"></tbody>

                </table>
            </div>
           
        </div>

    </div>


    <script src="mainP.js"></script>
</body>
</html>
